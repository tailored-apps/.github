name: Publish to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate weekly cache key
        id: cache-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache pip and MkDocs data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache
            .cache
          key: ${{ runner.os }}-mkdocs-${{ steps.python.outputs.python-version }}-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-${{ steps.python.outputs.python-version }}-

      - name: Install dependencies
        run: python -m pip install --upgrade mkdocs-material

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish
        run: mkdocs gh-deploy --force
